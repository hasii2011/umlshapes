name: CI

on:
  push:
    branches: [ 'master', 'main' ]
  pull_request:
    branches: [ 'master', 'main' ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies for wxPython and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libsdl2-dev xvfb

      - name: Cache wxPython wheel
        id: cache-wxwheels
        uses: actions/cache@v4
        with:
          path: wxwheels
          key: wxwheels-${{ runner.os }}-py${{ matrix.python-version }}-wxPython-4.3.1

      - name: Download wxPython 4.3.1 wheel from Phoenix Releases
        if: steps.cache-wxwheels.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wxwheels
          PY_VER_COMPACT="${{ matrix.python-version }}"
          PY_TAG="cp${PY_VER_COMPACT//./}"
          gh release download wxPython-4.3.1 \
            --repo wxWidgets/Phoenix \
            --pattern "*${PY_TAG}*ubuntu-22.04*.whl" \
            --dir ./wxwheels

      - name: Install dependencies and umlshapes with test and deploy extras
        run: |
          python -m pip install --upgrade pip
          pip install --find-links ./wxwheels -e '.[test,deploy]'

      - name: Run Type Checks (mypy)
        run: |
          mypy --config-file .mypi.ini src

      - name: Run Unittest Suite
        env:
          PYTHONPATH: src:.
        run: |
          xvfb-run -a python -m unittest discover -s tests -t . -p 'Test*.py' -v

      - name: Verify Package Build
        run: |
          python -m build --sdist --wheel

      - name: Check Package with Twine
        run: |
          twine check dist/*
