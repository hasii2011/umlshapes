
[mypy]
python_version = 3.13
pretty = True
warn_unused_ignores = True
warn_redundant_casts = True
implicit_optional = True
strict_equality = True
check_untyped_defs = True

[mypy-HtmlTestRunner.*]
ignore_missing_imports = True

[mypy-wx.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-wx.lib.ogl.*]
follow_imports = silent
follow_untyped_imports = True
ignore_errors = True

[mypy-human_id.*]
ignore_missing_imports = True

[mypy-pubsub.*]
ignore_missing_imports = True

[mypy-pyautogui.*]
ignore_missing_imports = True

[mypy-pymsgbox.*]
ignore_missing_imports = True

[mypy-Deprecated.*]
ignore_missing_imports = True
